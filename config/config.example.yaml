# Copy to config/config.yaml (git-ignored) and edit.
# MT5 credentials are best set as environment variables:
#   MT5_LOGIN, MT5_PASSWORD, MT5_SERVER  (they override the values below)

mode: paper            # paper = log signals, place no orders | live = send real orders

mt5:
  login: 0
  password: ""
  server: ""           # e.g. the FundedNext server shown in your MT5 login details
  path: ""             # optional: full path to terminal64.exe

strategy: ict_sweep    # ict_sweep | breakout_retest
symbols: [EURUSD, GBPUSD]
timeframe: M15         # M1 M5 M15 M30 H1 H4 D1
bars: 600              # history scanned each candle (>= 3x the longest indicator)
poll_seconds: 5
server_utc_offset_hours: 0   # MT5 server time minus UTC (check MT5 Market Watch clock vs UTC; often 2 or 3)
rr: 3.0                # take profit = 3 x stop distance

# SMT pairs (only used when ict_sweep has smt: true): symbol -> correlated symbol.
smt_pairs:
  EURUSD: GBPUSD
  GBPUSD: EURUSD

strategy_params:
  breakout_retest:
    pivot_left: 5
    pivot_right: 5
    ema_trend: 200           # 0 disables the trend filter
    rsi_period: 14
    rsi_long_min: 45         # longs need RSI >= 45 (shorts: RSI <= 55)
    stoch_k: 14
    stoch_smooth: 3
    stoch_d: 3
    stoch_oversold: 30       # %K must have dipped to <= 30 (shorts: >= 70) recently
    stoch_lookback: 5
    fib_min: 0.382           # retest depth of the breakout leg
    fib_max: 0.618
    retest_tolerance_atr: 0.3
    sl_buffer_atr: 0.2
    max_retest_bars: 20
    min_body_ratio: 0.5
    sessions: []             # e.g. ["07:00-16:00"] (UTC); empty = any time
  ict_sweep:
    pivot_left: 3
    pivot_right: 3
    use_prev_day: true
    smt: false               # true = also require SMT divergence vs smt_pairs (optional)
    sweep_max_bars: 10
    fvg_wait_bars: 15
    min_fvg_atr: 0.1
    require_bullish_close: true
    sl_buffer_atr: 0.1
    sessions: ["07:00-10:00", "12:00-15:00"]   # London / New York kill zones, UTC

risk:
  risk_per_trade_pct: 0.25     # $5 on $2,000. 6% trailing = $120 room = ~24 straight losses at 0.25%
  max_open_positions: 2
  magic: 150820
  deviation_points: 20
  commission_per_lot: 7        # USD per lot, charged on open (Stellar Instant forex)

# FundedNext rules. Defaults = Stellar Instant 2K as read from the
# FundedNext MCP: no daily loss limit, 6% trailing max loss, 3% risk limit per idea.
# Re-check any time with the MCP: get_account_applicable_rules / get_account_overview.
prop:
  initial_balance: 2000
  daily_loss_pct: 0            # firm daily limit; 0 = none (Instant). 2-Step: 5, 1-Step: 3
  max_loss_pct: 6              # Instant: 6 trailing. 2-Step: 10 static
  trailing_max_loss: true
  safety_buffer: 0.8           # never risk more than 80% of the firm's loss room
  personal_daily_stop_pct: 2   # your own daily stop: $40/day, then the bot stops until tomorrow
  risk_limit_pct: 3            # firm risk limit per trade idea
  high_water_balance: 0        # highest balance so far (MCP overview: trailing_drawdown + 120); 0 = start
  ea_max_account_size: 50000   # FundedNext: no EAs/bots at $50k+
  flatten_on_limit: true       # close the bot's positions if a stop level is reached

backtest:
  contract_size: 100000
  slippage_pips: 0.2           # extra cost on every entry and stop-loss exit
  spread_pips:                 # typical raw-spread values; override with --spread-pips
    EURUSD: 0.4
    GBPUSD: 0.7
    USDJPY: 0.6
    default: 1.0

news:
  file: data/news.json
  minutes_before: 10           # FundedNext's rule window is 5 min each side
  minutes_after: 10

state_file: data/state.json
log_file: data/bot.log
